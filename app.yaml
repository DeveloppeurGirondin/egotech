runtime: python312
instance_class: F1

automatic_scaling:
  max_instances: 2

handlers:
  - url: /favicon\.ico
    static_files: favicon.ico
    upload: favicon\.ico

  - url: /site\.webmanifest
    static_files: site.webmanifest
    upload: site\.webmanifest

  - url: /file
    static_dir: file

  - url: /css
    static_dir: css

  - url: /images
    static_dir: images

  - url: /scripts
    static_dir: scripts

  - url: /.*
    static_files: index.html
    upload: index.html
    secure: always
